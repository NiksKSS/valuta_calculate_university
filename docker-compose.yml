services:
  backend:
    build: ./backend
    container_name: valuta-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3000
      RATES_API_URL: ${RATES_API_URL:-https://open.er-api.com/v6/latest/USD}
      CACHE_TTL_MS: ${CACHE_TTL_MS:-600000}
      FETCH_TIMEOUT_MS: ${FETCH_TIMEOUT_MS:-8000}
    expose:
      - "3000"
    networks:
      - valuta-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: valuta-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - valuta-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  valuta-net:
    driver: bridge